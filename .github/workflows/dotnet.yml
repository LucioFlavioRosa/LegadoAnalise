name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore SistemaAvaliacao.Moderno/SistemaAvaliacao.Moderno.csproj

      - name: Build
        run: dotnet build SistemaAvaliacao.Moderno/SistemaAvaliacao.Moderno.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test SistemaAvaliacao.Moderno.Tests/SistemaAvaliacao.Moderno.Tests.csproj --configuration Release --no-build --logger trx

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Code Analysis
        run: dotnet format SistemaAvaliacao.Moderno/SistemaAvaliacao.Moderno.csproj --verify-no-changes

  deploy:
    name: Deploy to Azure Web App
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: dotnet publish SistemaAvaliacao.Moderno/SistemaAvaliacao.Moderno.csproj -c Release -o ./publish

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
